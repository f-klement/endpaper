# Bun configuration for the Endpaper frontend.

[install]
# Refuse an npm version published less than three days ago. **This key is the
# whole npm supply chain window, and without it there is none**: bun's default
# is `null`, meaning disabled, and every `newerThanMinimumReleaseAge` in a
# `bun audit fix --dry-run` report reads `false` no matter how new the fix is.
# Measured on the pinned bun 1.4.0 against lodash 4.18.0, 148 days old: unset
# gives false, 0 gives false, and 315360000 gives true. It is config driven and
# there was no config, so the flag the unattended patch pipeline reads to refuse a
# brand new fix was answering a question nobody had asked.
#
# 259200 is bun's own documented example and the same three days the unattended
# release applies to PyPI through `uv lock --exclude-newer`, so one number
# covers both ecosystems.
#
# Why repo wide rather than only in the unattended job: the dependency bot
# automerges npm minor and patch updates, so a compromised release reaches
# `main` and the shipped image without anyone looking at it. That is the same
# exposure the nightly bumper has, and it is the more common one.
#
# **A stated consequence.** `bun install --frozen-lockfile` does no resolution,
# so it is unaffected: verified exit 0 against the v0.9.0 lockfile in the pinned
# image with this key set. A Renovate merge request landing a version under
# three days old will now fail its install instead, loudly and in CI. That is
# the intended direction; wait for the version to age rather than removing this.
#
# **This key is also the fallback, and the fallback can drift.** The unattended
# release passes `--minimum-release-age` explicitly so the unattended path does not depend on
# this file, but bun does not reject unknown flags: `bun audit fix
# --minimum-release-age-typo=1` exits 0 and is silently ignored. So if a future bun
# renames the flag, npm falls back to the number here, which is correct only while it
# matches. Change `AUTOPATCH_MIN_RELEASE_AGE_DAYS` and this key together, or npm
# quietly keeps three days while PyPI gets the new value.
minimumReleaseAge = 259200

[install.security]
# Socket screens every package Bun is about to install against its supply-chain
# database: malware, typosquats, install-time scripts that phone home. It runs
# on `bun install`, `bun add` and `bun update`, before any package code is
# executed, which is the only moment that actually helps.
#
# Findings come back at two levels: `fatal` aborts the install with a non-zero
# exit code, `warn` prompts in an interactive terminal and aborts in CI.
#
# No account is needed. Without SOCKET_API_KEY it uses Socket's free public
# API. Set that variable (scope: `packages`) only if this ever gets pointed at
# a Socket organisation with custom policy.
scanner = "@socketsecurity/bun-security-scanner"
