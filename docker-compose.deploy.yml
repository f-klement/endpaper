services:
  endpaper:
    image: fklement/endpaper:latest@sha256:aac9f41997e2f06ed5424ede7f022c7efd39fc01a8d24c720f8d17f8a03ae9a9
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
