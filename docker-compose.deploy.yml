services:
  endpaper:
    image: fklement/endpaper:latest@sha256:67eecc1a7d792ac8d6a0bf5bf1ce667dd3c04f6ebc5c622a827c641326a686c0
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
