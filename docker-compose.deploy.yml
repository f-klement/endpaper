services:
  endpaper:
    image: fklement/endpaper:latest@sha256:5d65e658b90a801b18a9991081ba680c0dc4b32751f513eee074f1c5a0af2c7d
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
