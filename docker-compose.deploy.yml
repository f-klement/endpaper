services:
  endpaper:
    image: fklement/endpaper:latest@sha256:2a0ae633da9a05694ca4256b460c87d874b5887f8c9cd75fbbae9ad2c8fcced9
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
