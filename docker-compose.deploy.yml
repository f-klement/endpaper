services:
  endpaper:
    image: fklement/endpaper:latest@sha256:1ab7e9a93835b2b03e87ff4ea434fa4948b6fd7c46b28cb8676db2225263c301
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
