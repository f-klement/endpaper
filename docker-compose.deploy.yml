services:
  endpaper:
    image: fklement/endpaper:latest@sha256:16a25ddc5930b9ee45f9b9d84c7276e16785b2e2f6035a301567b7063badbb43
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
