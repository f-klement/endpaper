services:
  endpaper:
    image: fklement/endpaper:latest@sha256:879bbe9d7e7b9fa56de8d8cdee605c5ed52074221cdf1fd9213c3869b03409fa
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
