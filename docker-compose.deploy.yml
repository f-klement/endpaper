services:
  endpaper:
    image: fklement/endpaper:latest@sha256:9c18e8297c43ac0c3b8dd82d2f24033ddf09b946bd1641f36fff6bbf22974715
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
