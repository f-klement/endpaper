services:
  endpaper:
    image: fklement/endpaper:latest@sha256:6b89142c739f94789637f9364d91d981ca5a46b355c0bbdb65552590f8004843
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
