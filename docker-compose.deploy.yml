services:
  endpaper:
    image: fklement/endpaper:latest@sha256:f91e3609edccd4556bbaba576c0b9b06b4b21e96b8980600de56cdf5009a9533
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
