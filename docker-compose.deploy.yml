services:
  endpaper:
    image: fklement/endpaper:latest@sha256:0825e9583dc29c09c1d80c9256d374ffa0a783e0d647e80750c5d4e8769296ab
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
