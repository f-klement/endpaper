services:
  endpaper:
    image: fklement/endpaper:latest@sha256:d004b459afb56dd76c1ea542e35be073aef3c7c21ef62094171c33c797c9a90b
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
