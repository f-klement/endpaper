services:
  endpaper:
    image: fklement/endpaper:latest@sha256:97d33a42eec666f93f07d8bdb4ec8c73f67f2ac312340737ed1d8c875a61d9ce
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
