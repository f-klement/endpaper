services:
  endpaper:
    image: fklement/endpaper:latest@sha256:8b47ac68f11d2b0d9ef37b060f5174ba80e8dc8013ab664736c24a4803fc57e9
    container_name: endpaper
    ports:
      - "8000:8000"     # change left side to any free host port e.g. 8123:8000
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=REPLACE_WITH_A_LONG_RANDOM_STRING
      - DATABASE_URL=sqlite:///./data/library.db
    restart: unless-stopped
