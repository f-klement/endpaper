# The subject vocabularies this application treats as first class, in the
# format of ADR 0009: InvenioRDM's subject declaration, with `origin`,
# `origin-format`, `licence` and `suggest` added. `data-file` is where the
# converter writes the entries, relative to the data directory.
subjects:
  pid-type: sub
  schemes:
    - id: gnd
      name: Gemeinsame Normdatei, Sachbegriffe
      uri: "https://www.dnb.de/gnd"
      data-file: vocabularies/subjects_gnd.jsonl
      origin: "https://data.dnb.de/opendata/authorities-gnd-sachbegriff_lds.jsonld.gz"
      origin-format: [gzip, json]
      licence: CC0-1.0
    - id: lcsh
      name: Library of Congress Subject Headings
      uri: "https://id.loc.gov/authorities/subjects.html"
      data-file: vocabularies/subjects_lcsh.jsonl
      origin: "https://id.loc.gov/download/authorities/subjects.skosrdf.jsonld.gz"
      origin-format: [gzip, jsonl]
      licence: public-domain
