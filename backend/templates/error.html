<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} · Endpaper</title>
    <style>
      /* Self-contained: an error page must not depend on the asset pipeline,
         since a build or storage failure is one of the things it has to
         report. Colours mirror the app's sky palette. */
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #f9fafb;
        color: #111827;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        background: #fff;
        border: 1px solid #f3f4f6;
        border-radius: 1rem;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
        padding: 2.5rem 2rem;
        text-align: center;
      }
      .glyph { font-size: 3.5rem; line-height: 1; margin-bottom: 0.75rem; }
      .code {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #0ea5e9;
        margin-bottom: 0.5rem;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0; color: #6b7280; font-size: 0.875rem; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.625rem 1.25rem;
        background: #0ea5e9;
        color: #fff;
        border-radius: 0.5rem;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 600;
      }
      a:hover { background: #0284c7; }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1220; color: #e5e7eb; }
        .card { background: #111827; border-color: #1f2937; }
        p { color: #9ca3af; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="glyph">{{glyph}}</div>
      <div class="code">Error {{status}}</div>
      <h1>{{title}}</h1>
      <p>{{message}}</p>
      <a href="/">Back to the library</a>
    </main>
  </body>
</html>
