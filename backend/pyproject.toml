[project]
name = "endpaper-backend"
# Not the release version, which is derived from the git tag at build time: see
# "The version is derived, not declared" in docs/decisions.md. Nothing reads this
# field, there is no [build-system] and nothing is published to an index, so a real
# number here would only rot into a second answer to "what am I running".
version = "0.0.0"
description = "Endpaper backend (FastAPI)"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.38",
    "pyjwt>=2.10.1",
    "bcrypt>=4.2.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "alembic>=1.14",
    "ldap3>=2.9.1",
    "rapidfuzz>=3.14.5",
    "cryptography>=50.0.1",
    "mnemonic>=0.21",
    # The Postgres driver, and it is a runtime dependency rather than a dev one
    # because the image is what an operator gets. Postgres is the supported
    # optional drop in and the schema is created on one in CI, so without this
    # line `DATABASE_URL=postgresql+pg8000://...` answers with an import error
    # rather than a database, and the only way to run a documented option is to
    # build your own image.
    #
    # **pg8000 rather than psycopg, and that is what makes it affordable here.**
    # pg8000 is pure Python, so it installs on the image's musl with no libpq and
    # no compiler; psycopg publishes no musl wheel and psycopg2 wants both. The
    # cost is measured rather than assumed, and **this comment is its one
    # home**: the published files quote a rounded figure and point here, because
    # a seven digit number in four places is four things to update and nothing
    # recomputes any of them.
    #
    # The image's venv goes from 110,640,423 bytes over 38 distributions to
    # 113,001,547 over 43: 2,361,124 bytes and 141 files, measured 2026-09-17 by
    # running the Dockerfile's own `uv sync --frozen --no-dev
    # --no-install-project` under UV_COMPILE_BYTECODE=1 on the pipeline's uv
    # image, and reconciled to the byte against a per entry sweep of the
    # installed tree. Four of the five distributions are pg8000's own chain:
    # scramp, asn1crypto, python-dateutil and six.
    #
    # **That is the uncompressed layer, bytecode included, and not what a pull
    # moves.** The compressed figure is not measured; for scale, the five wheels
    # total 419,934 bytes in `uv.lock`.
    #
    # **`postgresql+pg8000://` is the spelling, and a bare `postgresql://` still
    # fails.** SQLAlchemy resolves that to psycopg2, which is not here and cannot
    # be: it needs libpq and a compiler. The published tables say the full scheme
    # for that reason.
    #
    # **The connection is not certificate checked, and drops to cleartext
    # silently if the server declines TLS.** It is authenticated, by the
    # password in the URL; what nothing authenticates is the server.
    # With no `ssl_context`, `pg8000.core._make_socket` builds a default context
    # and then sets `check_hostname = False` and `verify_mode = CERT_NONE`; if
    # the server does not answer the SSLRequest with `S`, the `elif
    # orig_ssl_context is not None` arm is false and the session **continues in
    # cleartext** with nothing raised. `database.py` passes `connect_args={}` for
    # every non SQLite URL and SQLAlchemy's pg8000 dialect copies `url.query` in
    # as strings, so no `DATABASE_URL` can supply an `SSLContext`. Verified
    # against pg8000 1.31.5's own source, 2026-09-17. Honouring an `sslmode` is a
    # change to `database.py` and is in the tracker.
    #
    # Its paramstyle is `format`, the same `%` hazard psycopg2 has, so
    # `database.MonthBucket`'s note about choosing a `to_char` pattern with no `%`
    # in it still holds under this driver rather than being a claim about a
    # different one.
    "pg8000>=1.31.5",
]

[project.optional-dependencies]
# The OS keychain, and it is deliberately not a hard dependency. The published
# image is Alpine with no session bus and no keychain, so `keyring` there is
# four packages that can only ever answer "no backend available". The desktop
# and mobile builds install this extra; `credentials._keyring` reports the
# source unavailable without it, and the dev group carries it so the suite
# exercises that path rather than asserting it.
desktop = ["keyring>=25.7.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.2",
    "pytest-xdist>=3.6.1",
    "pytest-timeout>=2.4.0",
    "respx>=0.22.0",
    "schemathesis>=4.27.5",
    "ruff>=0.9.4",
    "mypy>=1.14.1",
    "pip-audit>=2.9.0",
    "jsonschema>=4.23.0",
    "keyring>=25.7.0",
    "hypothesis>=6.168.0",
    "mutmut>=3.8.0",
]

[tool.pytest.ini_options]
# Tests live in a mirror tree, never beside the module under test.
testpaths = ["tests"]
# The application modules are imported flat ("from models import Book"), the
# way uvicorn imports them with backend/ as the working directory.
pythonpath = ["."]
# importlib import mode is required, not cosmetic: the test tree mirrors the
# source tree, so tests/test_auth.py and tests/routers/test_auth.py share a
# basename. The default "prepend" mode derives module names from the basename
# and refuses to collect the second one.
# `-n 2`, not `-n auto`. The suite is expected to share a small CI host with
# other work, and the runner is capped at two cores for that reason. `auto`
# would spawn one worker per core only to be throttled back, which is the same
# work done slower, and a throttled job looks like one that needs a bigger
# limit. Raise both numbers together or neither.
#
# Parallel is safe here by construction rather than by luck being noticed late:
# tests/conftest.py builds DATA_DIR with `tempfile.mkdtemp()` at import time, so
# every xdist worker is a separate process with its own directory, its own
# test.db and its own COVERS_DIR. Nothing is shared to race over.
#
# **No duration is written here, and that is the correction rather than an
# omission.** This paragraph carried a serial duration, a two worker duration and
# a test count, for long enough that the suite grew past five times that count. A
# figure nobody re-derives is read as current for exactly as long as it sits
# there, so restating the old ones here would keep them copyable in the one home
# that publishes. They are not restated anywhere that publishes, which the
# decision register says of itself too: the one attributed reading is in a
# document the gate strips.
# `tests/COVERAGE.md` recomputes the test count on every run, which is what a
# number that has to stay true looks like.
#
# **A duration is a fact about a machine and a worker count, not about this
# line.** Recorded readings of this suite are far apart, and they differ in the
# machine and in the worker count at once, so nothing on record separates the
# two effects. Neither was taken at the number here either: a command line `-n`
# wins over the one in `addopts`, so a harness that passes its own worker count
# is not measuring this setting at all. Read the current duration off the
# pipeline's own job report, and take your own with `--durations`, saying which
# machine and which worker count produced it.
#
# **What carries this setting was never the durations.** The suite is closer to
# I/O bound than CPU bound: it drops and recreates every table between tests,
# and two workers were measured using 0.68 cores between them. So more workers
# buy wall clock by overlapping waiting rather than by using more CPU, which is
# why the ratio was never the full 2x, and why the old 3500m CI limit was
# unjustified even before this: the serial run was never short of cores. None of
# that depends on how many tests the suite holds, which is why it stays and the
# figures went.
#
# `--dist loadfile` keeps a file's tests on one worker. `load` scatters them,
# and this suite has files whose tests share a module-level counter
# (covers.reset_counts) or build on one another within the file.
#
# ── A hung test fails as a named test ────────────────────────────────────────
#
# `--timeout` bounds every test, so a hang arrives as a named failure rather than
# as a job timeout naming nothing. Nothing here bounded a wait before it:
# measured 2026-09-26, a worker parked nine minutes with no verdict, and
# `-o faulthandler_timeout=60` dumped tracebacks without aborting the run.
#
# **The value has a floor derived from what this test tree declares, rather than
# a number chosen from what it has been observed to take.** Durations alone
# would put it near 60: the
# worst reading over five recent backend jobs is a 28s stall on a test that costs
# 0.05s on every other run. But the tree declares its own ceilings, and measured
# on this base the largest is 300, at twelve subprocess waits. A global below
# that silently overrides a declared ceiling at exactly the sites whose subject
# is a process that will not stop. So the rule is: **strictly above the largest
# ceiling the test tree declares.** `tests/test_a_hung_test_is_named.py` asserts
# that relation by walking the tree, so a test that later declares a longer wait
# reddens a guard and forces a decision instead of being halved by a line nobody
# re-read. The floor is a fact about the tree rather than somebody's judgement
# about a distribution, which is why no duration is written beside it.
#
# **What that guard does not hold, said here rather than left to be found.** It
# is a floor with no upper term: nothing in it stops this value being raised
# until the ceiling never fires, and 36000 would be as green as 360. What makes
# a high ceiling safe is not that guard, it is the reconciliation named below,
# which refuses a session that lost a test to anything at all, a bound that
# never fired included. And the floor is necessary rather than sufficient: a
# test that legitimately spends its declared 300 seconds and then does anything
# else is still cut by a global one second above it, and its escape is the
# marker at its own site like any other long test's.
#
# **`--timeout-method=signal`, pinned rather than left to the plugin default.**
# Measured: the signal method fails the hanging test by name and the worker
# survives, so the rest of the run completes. The thread method calls `os._exit`,
# which is indistinguishable from a crash: nine restarts, the same test reported
# failed nine times, 20 report entries for 13 collected tests. The default
# behaves like the first of those today, which is exactly why leaving it implicit
# is wrong: it is one command line flag, or one platform without SIGALRM, away
# from the second, and the second looks like a crash rather than like a
# configuration mistake.
#
# **`--max-worker-restart=0`, and it is not belt and braces.** xdist defaults to
# `numprocesses * 4`, so 8 here, and under `--dist loadfile` a dead worker hands
# its item to the replacement, which dies on it too. Measured at the default: ten
# workers consumed, one test reported failed ten times, 35 report entries for 31
# collected tests, five tests never run, and a reader who checks the count sees
# it go **up**. Deleting this line does not restore a tolerant run, it restores
# that.
#
# **All three here rather than as ini keys, because that is what keeps them
# armed.** With the plugin absent, `--timeout` on the command line is a usage
# error and the run refuses; an unknown ini key is a warning and the run proceeds
# unbounded. `--max-worker-restart` has no ini key at all.
#
# What restarts off costs is a louder failure after a genuine one off worker
# death, against an old behaviour that was longer and more misleading. What makes
# that trade safe is the reconciliation in `tests/conftest.py`, which turns a
# short session into a named refusal. A test that legitimately needs longer takes
# `@pytest.mark.timeout(n)` at its own site, which is a change to that test
# rather than to this line.
addopts = "-q --strict-markers --import-mode=importlib -n 2 --dist loadfile --max-worker-restart=0 --timeout=360 --timeout-method=signal"
# `--strict-markers` is on, so a marker exists here or it is an error rather
# than a silent typo that deselects nothing.
#
# `property` marks a test whose inputs hypothesis generates. It is not a way to
# skip them: they run in the default suite, because a property nobody runs is a
# property nobody knows the truth of. What the marker buys is a measurement,
# `-m property` being how the budget below is costed, and one line of escape for
# somebody chasing an unrelated failure.
# `tests/test_property_budget.py` refuses a generated test that does not carry
# it, so the two cannot drift.
markers = [
    "property: inputs generated by hypothesis rather than written out",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mutmut]
# **mutmut is used as a mutant GENERATOR here and never as a sweep engine.** The
# wrapper asks it for the mutations of one file and applies them one at a time; it
# never runs `mutmut run`, so nothing below selects tests or writes a `mutants/` tree.
#
# This section has to exist even so. mutmut loads its config from the pyproject.toml
# in the CURRENT directory at first use, and with no `[tool.mutmut]` it falls back to
# guessing a source directory from the directory's own name, which for `backend` is a
# guess that misses and raises. So the section is what makes generation start at all.
source_paths = ["."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "S", "ASYNC", "RUF"]
# W605 is an invalid escape sequence, `\d` in a non raw string. CPython warns
# about it today and has it scheduled to become a SyntaxError, at which point the
# file stops importing. This is the fast path: a column and an autofix, in a job
# that runs before the suite. The backstop is
# TestEveryPythonFileCompilesWithoutAWarning, which asks the compiler rather than
# a rule list, and the two are not redundant: see that class's docstring.
#
# `extend-select` with the one rule rather than the whole `W` family on purpose.
# Measured 2026-09-02: `--select W` reports one further finding, W291 trailing
# whitespace in a generated Alembic header, which is a tidiness preference nobody
# asked for. W605 alone reports nothing today.
extend-select = ["W605"]
ignore = [
    # FastAPI's dependency-injection idiom is a function call in a default
    # argument, which B008 exists to forbid.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# ── The whole `S` family, off in the test tree ───────────────────────────────
#
# Its premise is production code handling a stranger's input, and a test tree is
# neither. **Stated as the family, which is the exclusion**, rather than as the
# codes it happens to fire today: a code list is an enumeration over something
# the tool's authors control, so the next `S` rule ruff ships would arrive
# loudly wrong here and somebody would add a thirteenth entry. `select` still
# names `"S"`, so a new rule is on in application code either way.
#
# **What it silences is a command, not a number.** The figure was written here
# three times and was stale all three, inside the single change that introduced
# it, because every test arm added anywhere in the tree is another `assert` and
# the count moves under its own feet. A number that cannot be kept true is worse
# than no number: it is read as current. Run this, which is the instrument
# because the ignore hides its own subject:
#
#   ruff check --config 'lint.per-file-ignores = {}' --select S --statistics tests
#
# Twelve codes fire, and essentially all of it is `S101`: the assertion each
# test exists to make. The rest are fixture passwords, fixture XML, and the
# subprocess calls that run the suite runner and the publish gate.
#
# **What still covers these files, stated as what it does rather than as a
# ranking.** `TestNoFixtureLooksLikeACredential` catches a realistic Telegram
# bot token and an address outside reserved space; the publish gate's own
# forbidden string scan catches the GitLab and GitHub access token prefixes and
# the private key header. Neither
# is a superset of `S105`/`S106`: a plausible API key spelled `api_key = "..."`
# fires the rule and matches neither. There is no such value in the tree today.
#
# ── RUF012, mutable class default ────────────────────────────────────────────
#
# In a test tree that is a table of cases hanging off the class that reads it.
# 45 sites, no defect in any, and a `ClassVar` on each buys a reader nothing.
#
# ── RUF001, ambiguous unicode in a string ────────────────────────────────────
#
# A confusable here is the input under test: a fullwidth `c` in a Calibre host
# name, Arabic-Indic digits against the ISBN reader, a Greek sigma in a MARC
# extent field as the catalogue sends it. 7 sites in 5 files.
#
# **`RUF002` and `RUF003` stay on**, over docstrings and comments, because those
# are prose. The one docstring that legitimately quotes a confusable carries a
# file level directive at its own head, where a reader of that file sees it.
"tests/**" = ["S", "RUF012", "RUF001"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]
# Required, not cosmetic: the test tree mirrors the source tree, so
# tests/test_auth.py and tests/routers/test_auth.py share a basename. Without
# these two, mypy derives module names from the basename, hits the collision
# and aborts before checking anything at all.
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# Tests assert on loosely-typed response bodies and deliberately pass invalid
# values to check validation. Full strictness there costs more than it catches.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
