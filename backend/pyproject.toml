[project]
name = "endpaper-backend"
# Not the release version, which is derived from the git tag at build time: see
# "The version is derived, not declared" in docs/decisions.md. Nothing reads this
# field, there is no [build-system] and nothing is published to an index, so a real
# number here would only rot into a second answer to "what am I running".
version = "0.0.0"
description = "Endpaper backend (FastAPI)"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.38",
    "pyjwt>=2.10.1",
    "bcrypt>=4.2.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "alembic>=1.14",
    "ldap3>=2.9.1",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.2",
    "pytest-xdist>=3.6.1",
    "respx>=0.22.0",
    "ruff>=0.9.4",
    "mypy>=1.14.1",
    "pip-audit>=2.9.0",
]

[tool.pytest.ini_options]
# Tests live in a mirror tree, never beside the module under test.
testpaths = ["tests"]
# The application modules are imported flat ("from models import Book"), the
# way uvicorn imports them with backend/ as the working directory.
pythonpath = ["."]
# importlib import mode is required, not cosmetic: the test tree mirrors the
# source tree, so tests/test_auth.py and tests/routers/test_auth.py share a
# basename. The default "prepend" mode derives module names from the basename
# and refuses to collect the second one.
# `-n 2`, not `-n auto`. The suite is expected to share a small CI host with
# other work, and the runner is capped at two cores for that reason. `auto`
# would spawn one worker per core only to be throttled back, which is the same
# work done slower, and a throttled job looks like one that needs a bigger
# limit. Raise both numbers together or neither.
#
# Parallel is safe here by construction rather than by luck being noticed late:
# tests/conftest.py builds DATA_DIR with `tempfile.mkdtemp()` at import time, so
# every xdist worker is a separate process with its own directory, its own
# test.db and its own COVERS_DIR. Nothing is shared to race over.
#
# Measured: 22m50s serial, 11m50s at -n 2, same 1634 tests. Not the full 2x,
# because the suite is closer to I/O bound than CPU bound: it drops and
# recreates every table between tests, and two workers were observed using
# 0.68 cores between them. That is also why the old 3500m CI limit was
# unjustified even before this: the serial run was never short of cores.
#
# `--dist loadfile` keeps a file's tests on one worker. `load` scatters them,
# and this suite has files whose tests share a module-level counter
# (covers.reset_counts) or build on one another within the file.
addopts = "-q --strict-markers --import-mode=importlib -n 2 --dist loadfile"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    # FastAPI's dependency-injection idiom is a function call in a default
    # argument, which B008 exists to forbid.
    "B008",
]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]
# Required, not cosmetic: the test tree mirrors the source tree, so
# tests/test_auth.py and tests/routers/test_auth.py share a basename. Without
# these two, mypy derives module names from the basename, hits the collision
# and aborts before checking anything at all.
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# Tests assert on loosely-typed response bodies and deliberately pass invalid
# values to check validation. Full strictness there costs more than it catches.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
