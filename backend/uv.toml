# uv's settings for the backend. They live here rather than under `[tool.uv]` in
# pyproject.toml because uv treats a setting it cannot parse differently in each file:
# in pyproject.toml it warns, drops the whole table and goes on, so a uv older than
# 0.9.17, which cannot read the duration below, would resolve the lock again with no
# age at all; in uv.toml it is an error and nothing runs. On a machine whose uv is
# older, the pinned uv runs any command here:
#   uv tool run --from uv==<the version the Dockerfile copies> uv <command>
# While this file exists uv ignores a setting under `[tool.uv]` in pyproject.toml, so
# every setting goes here. A project field, such as `[tool.uv.sources]`, uv reads only
# from pyproject.toml, and it goes there.

# A PyPI release has to be three days old before any `uv lock` here resolves it, the
# dependency bot's weekly lock refresh included, since its `uv lock --upgrade` runs in
# this directory and reads this file. The same three days as frontend/bunfig.toml. A
# duration rather than a date, so the window moves with the clock.
exclude-newer = "3 days"
